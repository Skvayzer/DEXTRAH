params:
  seed: 42
  env:
    clip_observations: 100.0
    clip_actions: 1.0
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  network:
    name: actor_critic
    separate: true
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init: {name: default}
        sigma_init: {name: const_initializer, val: -2}
        fixed_sigma: true
    mlp:
      units: [512, 512]
      activation: elu
      d2rl: false
      initializer: {name: default}
      regularizer: {name: None}
    rnn:
      name: lstm
      units: 1024
      layers: 1
      before_mlp: true
      layer_norm: true
      concat_input: true
      concat_output: true
  load_checkpoint: false
  load_path: ""
  config:
    name: adept_kuka_allegro_fmb
    expl_type: none
    env_name: rlgpu
    device: cuda:0
    device_name: cuda:0
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: true
    normalize_value: true
    value_bootstrap: false
    num_actors: -1
    reward_shaper: {scale_value: 0.01}
    normalize_advantage: true
    gamma: 0.998
    tau: 0.95
    learning_rate: 1.0e-5
    lr_schedule: linear
    schedule_type: standard
    max_epochs: 200000
    save_best_after: 100
    save_frequency: 200
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 2.0e-4
    truncate_grads: true
    e_clip: 0.05
    horizon_length: 16
    minibatch_size: 24576
    mini_epochs: 4
    critic_coef: 4
    clip_value: true
    seq_length: 16
    bounds_loss_coef: 0.0001
    zero_rnn_on_done: true
    central_value_config:
      minibatch_size: 24576
      mini_epochs: 4
      learning_rate: 5.0e-5
      kl_threshold: 0.016
      clip_value: true
      normalize_input: true
      truncate_grads: true
      network:
        name: actor_critic
        central_value: true
        mlp:
          units: [1024, 512]
          activation: elu
          d2rl: false
          initializer: {name: default}
          regularizer: {name: None}
        rnn:
          name: lstm
          units: 2048
          layers: 1
          before_mlp: false
          layer_norm: true
          concat_input: true
          concat_output: true
    player:
      deterministic: true
      games_num: 100000
      print_stats: true
wandb_activate: false
wandb_group: adept-posttrain
wandb_name: adept-fmb
wandb_entity: ""
wandb_project: adept
